  /notification/send:
    post:
      consumes:
      - application/json
      description: Creates one private notification per recipient and pushes to their
        open streams. Admin only.
      parameters:
      - description: Recipients and content
        in: body
        name: notification
        required: true
        schema:
          $ref: '#/definitions/notification.SendNotificationDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/notification.NotificationDto'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send notification to users
      tags:
      - notification
  /notification/stream:
    get:
      description: Server-Sent Events stream. Emits "notification" events with NotificationDto
        payload. Closes when the access token expires; client must reconnect with
        a fresh token and refetch the inbox.
      produces:
      - text/event-stream
      responses:
