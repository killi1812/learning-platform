            $ref: '#/definitions/notification.NotificationDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark notification as seen
      tags:
      - notification
  /notification/seen-all:
