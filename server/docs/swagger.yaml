      - application/json
      responses:
        "200":
          description: Information about server
          schema:
            $ref: '#/definitions/info.ServerInfoDto'
      summary: Get server info
      tags:
      - info
  /notification:
    get:
      description: Returns the caller's notifications, newest first. Use before (RFC3339
        created_at) to page.
      parameters:
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Return notifications created before this RFC3339 time
        in: query
        name: before
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/notification.NotificationDto'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List own notifications
      tags:
      - notification
  /notification/{uuid}:
    delete:
      parameters:
      - description: Notification UUID
        in: path
        name: uuid
