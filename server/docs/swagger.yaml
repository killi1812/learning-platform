definitions:
  auth.LoginDto:
    properties:
      email:
        example: superadmin@example.com
        type: string
      password:
        example: Pa$$w0rd
        type: string
      sessionId:
        type: string
    required:
    - email
    - password
    type: object
  auth.RegisterDto:
    properties:
      email:
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.SessionDto:
    properties:
      createdAt:
        type: string
      deviceName:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      isCurrent:
        type: boolean
    type: object
  auth.TokenDto:
    properties:
      accessToken:
        type: string
    type: object
  content.CreateHandinDto:
    properties:
      acceptsLateSubmissions:
        type: boolean
      deadline:
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - title
    type: object
  content.FileDto:
    properties:
      contentType:
        type: string
      createdAt:
        type: string
      description:
        type: string
      fileName:
        type: string
      fileSize:
        type: integer
      moduleUuid:
        type: string
      position:
        type: integer
      sourceUrl:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      uuid:
        type: string
    type: object
  content.HandinDto:
    properties:
      acceptsLateSubmissions:
        type: boolean
      createdAt:
        type: string
      deadline:
        type: string
      moduleUuid:
        type: string
      position:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      uuid:
        type: string
    type: object
  content.QuestionType:
    enum:
    - MULTIPLE_CHOICE
    - TRUE_FALSE
    - ORDERING
    - MATCHING
    - FILL_IN_THE_BLANKS
    type: string
    x-enum-varnames:
    - TypeMultipleChoice
    - TypeTrueFalse
    - TypeOrdering
    - TypeMatching
    - TypeFillInTheBlanks
  content.UpdateFileDto:
    properties:
      description:
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - title
    type: object
  content.UpdateHandinDto:
    properties:
      acceptsLateSubmissions:
        type: boolean
      deadline:
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - title
    type: object
  course.AddEnrollmentDto:
    properties:
      email:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/course.CourseRole'
        enum:
        - STUDENT
        - TEACHER
    required:
    - email
    type: object
  course.CourseDto:
    properties:
      createdAt:
        type: string
      description:
        type: string
      teachers:
        items:
          type: string
        type: array
      term:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      uuid:
        type: string
      year:
        type: integer
    type: object
  course.CourseRole:
    enum:
    - STUDENT
    - TEACHER
    type: string
    x-enum-varnames:
    - RoleStudent
    - RoleTeacher
  course.CreateCourseDto:
    properties:
      description:
        type: string
      term:
        enum:
        - SPRING
        - AUTUMN
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
      year:
        maximum: 2100
        minimum: 2000
        type: integer
    required:
    - term
    - title
    - year
    type: object
  course.CreateModuleDto:
    properties:
      dependsOnUuid:
        type: string
      position:
        type: integer
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - title
    type: object
  course.EnrollmentDto:
    properties:
      courseUuid:
        type: string
      enrolledAt:
        type: string
      role:
        $ref: '#/definitions/course.CourseRole'
      userEmail:
        type: string
      userUuid:
        type: string
      username:
        type: string
    type: object
  course.ModuleDto:
    properties:
      courseUuid:
        type: string
      dependsOn:
        $ref: '#/definitions/course.ModuleDto'
      dependsOnUuid:
        type: string
      position:
        type: integer
      title:
        type: string
      uuid:
        type: string
    type: object
  course.MyCourseDto:
    properties:
      course:
        $ref: '#/definitions/course.CourseDto'
      enrolledAt:
        type: string
      role:
        $ref: '#/definitions/course.CourseRole'
    type: object
  course.NewGroupDto:
    properties:
      courseUuid:
        type: string
      name:
        type: string
    type: object
  course.ReorderModulesDto:
    properties:
      moduleUuids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - moduleUuids
    type: object
  course.UpdateCourseDto:
    properties:
      description:
        type: string
      term:
        enum:
        - SPRING
        - AUTUMN
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
      year:
        maximum: 2100
        minimum: 2000
        type: integer
    required:
    - term
    - title
    - year
    type: object
  course.UpdateModuleDto:
    properties:
      dependsOnUuid:
        type: string
      position:
        type: integer
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - title
    type: object
  ginutil.ErrorResponse:
    properties:
      error:
        example: Example error, something went wrong
        type: string
    type: object
  info.ServerInfoDto:
    properties:
      build:
        type: string
      buildTimestamp:
        type: string
      commitHash:
        type: string
      version:
        type: string
    type: object
  notification.MarkAllSeenDto:
    properties:
      updated:
        type: integer
    type: object
  notification.NotificationDto:
    properties:
      body:
        type: string
      createdAt:
        type: string
      seenAt:
        type: string
      title:
        type: string
      url:
        type: string
      uuid:
        type: string
    type: object
  notification.SendNotificationDto:
    properties:
      body:
        maxLength: 5000
        minLength: 1
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
      url:
        description: URL is an internal path such as /courses/<uuid>. Absolute and
          protocol-relative URLs are rejected.
        maxLength: 2048
        type: string
      userUuids:
        items:
          type: string
        maxItems: 500
        minItems: 1
        type: array
    required:
    - body
    - title
    - userUuids
    type: object
  notification.UnreadCountDto:
    properties:
      count:
        type: integer
    type: object
  quiz.AssignmentDto:
    properties:
      acceptsLateSubmissions:
        type: boolean
      attemptsUsed:
        type: integer
      deadline:
        type: string
      maxAttempts:
        type: integer
      moduleTitle:
        type: string
      moduleUuid:
        type: string
      myResult:
        $ref: '#/definitions/quiz.ResultDto'
      passPercent:
        type: integer
      published:
        type: boolean
      title:
        type: string
      type:
        type: string
      uuid:
        type: string
      visibleFrom:
        type: string
      visibleUntil:
        type: string
    type: object
  quiz.AttemptDto:
    properties:
      answers:
        additionalProperties:
          items:
            type: integer
          type: array
        description: question uuid -> selected option indices
        type: object
      questions:
        items:
          $ref: '#/definitions/quiz.StudentQuestionDto'
        type: array
      startedAt:
        type: string
    type: object
  quiz.CreateQuizRequest:
    properties:
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - title
    type: object
  quiz.EditQuestionDto:
    properties:
      correct:
        items:
          type: integer
        type: array
      options:
        items:
          type: string
        type: array
      prompt:
        type: string
      type:
        $ref: '#/definitions/content.QuestionType'
      uuid:
        type: string
    type: object
  quiz.EditQuizDto:
    properties:
      maxAttempts:
        type: integer
      moduleUuid:
        type: string
      passPercent:
        type: integer
      published:
        type: boolean
      questions:
        items:
          $ref: '#/definitions/quiz.EditQuestionDto'
        type: array
      title:
        type: string
      uuid:
        type: string
      visibleFrom:
        type: string
      visibleUntil:
        type: string
    type: object
  quiz.QuestionInput:
    properties:
      correct:
        items:
          type: integer
        type: array
      options:
        items:
          type: string
        type: array
      prompt:
        maxLength: 1000
        minLength: 1
        type: string
      type:
        $ref: '#/definitions/content.QuestionType'
    required:
    - prompt
    - type
    type: object
  quiz.ReplaceQuestionsRequest:
    properties:
      questions:
        items:
          $ref: '#/definitions/quiz.QuestionInput'
        maxItems: 100
        type: array
    required:
    - questions
    type: object
  quiz.ResultDto:
    properties:
      attemptsUsed:
        type: integer
      maxAttempts:
        type: integer
      passed:
        type: boolean
      percent:
        type: number
    type: object
  quiz.SaveAnswerRequest:
    properties:
      selected:
        items:
          type: integer
        type: array
    required:
    - selected
    type: object
  quiz.StudentQuestionDto:
    properties:
      options:
        items:
          type: string
        type: array
      prompt:
        type: string
      type:
        $ref: '#/definitions/content.QuestionType'
      uuid:
        type: string
    type: object
  quiz.StudentResultRowDto:
    properties:
      attempts:
        type: integer
      email:
        type: string
      passed:
        type: boolean
      percent:
        type: number
      username:
        type: string
    type: object
  quiz.UpdateQuizRequest:
    properties:
      maxAttempts:
        maximum: 100
        minimum: 1
        type: integer
      passPercent:
        maximum: 100
        minimum: 0
        type: integer
      title:
        maxLength: 255
        minLength: 2
        type: string
      visibleFrom:
        type: string
      visibleUntil:
        type: string
    required:
    - title
    type: object
  submission.CreateSubmissionDto:
    properties:
      payloadType:
        allOf:
        - $ref: '#/definitions/submission.PayloadType'
        enum:
        - URL
        - FILE
        example: URL
      payloadUrl:
        example: https://git.app.uib.no/student/exercise1.git
        maxLength: 2048
        type: string
    required:
    - payloadType
    - payloadUrl
    type: object
  submission.PayloadType:
    enum:
    - URL
    - FILE
    type: string
    x-enum-comments:
      PayloadTypeFile: Reserved for uploaded documents; not accepted yet
      PayloadTypeURL: Link to a git repository or externally hosted document
    x-enum-descriptions:
    - Link to a git repository or externally hosted document
    - Reserved for uploaded documents; not accepted yet
    x-enum-varnames:
    - PayloadTypeURL
    - PayloadTypeFile
  submission.SubmissionAcceptedDto:
    properties:
      status:
        example: QUEUED
        type: string
      submittedAt:
        type: string
      uuid:
        example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        type: string
    type: object
  submission.SubmissionDto:
    properties:
      attempt:
        type: integer
      contentType:
        type: string
      fileName:
        type: string
      fileSize:
        type: integer
      isLate:
        type: boolean
      payloadType:
        $ref: '#/definitions/submission.PayloadType'
      payloadUrl:
        type: string
      submittedAt:
        type: string
      userEmail:
        type: string
      uuid:
        type: string
    type: object
  submission.UploadTicketDto:
    properties:
      expiresAt:
        type: string
      submittedAt:
        type: string
      ticketUuid:
        type: string
    type: object
  user.NewUserDto:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - user
        type: string
      username:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - password
    - role
    - username
    type: object
  user.UserDto:
    properties:
      email:
        type: string
      role:
        type: string
      username:
        type: string
      uuid:
        type: string
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user by email and password, returns access token,
        and sets HTTP-only refresh token cookie. sessionId is optional.
      parameters:
      - description: Login credentials (sessionId is optional)
        in: body
        name: loginDto
        required: true
        schema:
          $ref: '#/definitions/auth.LoginDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      description: Logs out current user session and clears refresh token cookie
      produces:
      - application/json
      responses:
        "204":
          description: Successfully logged out
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User Logout (Current Device)
      tags:
      - auth
  /auth/logout-all:
    post:
      description: Logs out all active sessions for current user and clears refresh
        token cookie
      produces:
      - application/json
      responses:
        "204":
          description: All sessions successfully logged out
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User Logout All Devices
      tags:
      - auth
  /auth/refresh:
    post:
      description: Generates a new access token and rotates HTTP-only refresh token
        cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh Access Token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user and returns access token; sets HTTP-only refresh
        token cookie
      parameters:
      - description: Registration credentials
        in: body
        name: registerDto
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.TokenDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      summary: User registration
      tags:
      - auth
  /auth/session:
    get:
      description: Returns all active sessions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/auth.SessionDto'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Active Sessions
      tags:
      - auth
  /auth/session/{uuid}:
    delete:
      description: Revokes a specific session by its ID
      parameters:
      - description: Session ID (UUID)
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Session successfully revoked
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke Session
      tags:
      - auth
  /course:
    get:
      description: Returns all courses with optional filtering by term and year
      parameters:
      - description: Term (SPRING or AUTUMN)
        in: query
        name: term
        type: string
      - description: Academic Year (e.g. 2026)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/course.CourseDto'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List courses
      tags:
      - course
    post:
      consumes:
      - application/json
      description: Creates a new course and auto-enrolls creator as TEACHER
      parameters:
      - description: Course information
        in: body
        name: course
        required: true
        schema:
          $ref: '#/definitions/course.CreateCourseDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/course.CourseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create course
      tags:
      - course
  /course/{uuid}:
    delete:
      description: Deletes a course and all related modules/enrollments (Teacher or
        Admin only)
      parameters:
      - description: Course UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete course
      tags:
      - course
    get:
      description: Returns a single course with details
      parameters:
      - description: Course UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course.CourseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get course by UUID
      tags:
      - course
    put:
      consumes:
      - application/json
      description: Updates course metadata (Teacher or Admin only)
      parameters:
      - description: Course UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Updated course information
        in: body
        name: course
        required: true
        schema:
          $ref: '#/definitions/course.UpdateCourseDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/course.CourseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update course
      tags:
      - course
  /course/{uuid}/assignment:
    get:
      description: Quizzes in the course ordered by module. Students see published
        quizzes and their own best result. Teachers also see drafts.
      parameters:
      - description: Course UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/quiz.AssignmentDto'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List course assignments
      tags:
      - quiz
  /course/{uuid}/content/{contentUuid}/submission:
    get:
      description: Teacher or Admin only. Returns all student submissions for an assignment.
      parameters:
      - description: Course UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Content UUID
        in: path
        name: contentUuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/submission.SubmissionDto'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ginutil.ErrorResponse'
        "500":
