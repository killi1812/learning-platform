services:
  postgres:
    image: postgres:17-alpine
    container_name: dev-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - postgres
          - db

  mongodb:
    image: mongo:latest
    container_name: dev-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - dev_mongo_data:/data/db
    networks:
      default:
        aliases:
          - mongo

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: dev-seaweedfs
    restart: unless-stopped
    ports:
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
    command: "server -filer"
    volumes:
      - dev_seaweedfs_data:/data
    networks:
      default:
        aliases:
          - seaweedfs

volumes:
  dev_postgres_data:
  dev_mongo_data:
  dev_seaweedfs_data:
