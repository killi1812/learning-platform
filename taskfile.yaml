version: "3"

vars:
  BREW_DEPS: "openjdk@25 docker colima npm node"
  PROJECT_DIR: "LearningPlatform"
  FRONTEND_DIR: "frontend"
  OUTPUT_DIR: "bin"

tasks:
  default:
    desc: "Default task (runs check)"
    cmds:
      - task: check

  setup:
    desc: "Verify and install required development dependencies via Homebrew"
    cmds:
      - cmd: |
          if task check >/dev/null 2>&1; then
            echo "✨ All dependencies are already installed and satisfied."
          else
            echo "🔧 Missing dependencies detected. Installing via Homebrew: {{.BREW_DEPS}}..."
            if ! command -v brew >/dev/null 2>&1; then
              echo "❌ Homebrew is required for automatic setup. Please install it from https://brew.sh"
              exit 1
            fi
            brew install {{.BREW_DEPS}}
            echo "🔄 Re-running checks..."
            task check
          fi
    silent: true

  check:
    desc: "Check git info and all required dependencies"
    cmds:
      - task: git-info
      - task: check-brew
      - task: check-docker
      - task: check-colima
      - task: check-java
      - task: check-node
    silent: true

  git-info:
    desc: "Prints your git info"
    cmds:
      - cmd: echo "----- Note this should be same as your gitlab -------"
      - cmd: echo "Name:" $(git config --get user.name)
      - cmd: echo "Email:" $(git config --get user.email)
    silent: true
    internal: true

  check-brew:
    desc: "Check if Homebrew is installed"
    platforms: [darwin]
    cmds:
      - cmd: |
          if command -v brew >/dev/null 2>&1; then
            echo "✅ Homebrew is installed: $(brew --version | head -n 1)"
          else
            echo "❌ Homebrew is not installed"
            exit 1
          fi
    silent: true
    internal: true

  check-docker:
    desc: "Check if Docker is installed (Linux)"
    platforms: [linux]
    cmds:
      - cmd: |
          if command -v docker >/dev/null 2>&1; then
            echo "✅ Docker is installed: $(docker --version)"
          else
            echo "❌ Docker is not installed"
            exit 1
          fi
    silent: true
    internal: true

  check-colima:
    desc: "Check if Colima is installed (macOS)"
    platforms: [darwin]
    cmds:
      - cmd: |
          if command -v colima >/dev/null 2>&1; then
            echo "✅ Colima is installed: $(colima version | head -n 1)"
          else
            echo "❌ Colima is not installed"
            exit 1
          fi
    silent: true
    internal: true

  check-java:
    desc: "Check if Java version 25 is installed"
    cmds:
      - cmd: echo "--------- !Important -----------"
      - cmd: echo "Don't forget to add java to PATH"
      - cmd: echo "--------------------------------"
      - cmd: |
          if ! java -version >/dev/null 2>&1; then
            echo "❌ Java is not installed or not in PATH. Java 25 is required."
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if echo "$JAVA_VER" | grep -q '^25'; then
            echo "✅ Java 25 is installed (version: $JAVA_VER)"
          else
            echo "❌ Java version 25 is required, but found version: $JAVA_VER"
            exit 1
          fi
    silent: true
    internal: true

  dev:
    desc: "Run Spring Boot application locally"
    dir: "{{ .PROJECT_DIR }}"
    deps: [dev:services]
    cmds:
      - defer: { task: dev:services-down }
      - cmd: ./gradlew bootRun || test $? -eq 130
    silent: true

  colima-status:
    desc: "Check if colima is running"
    platforms: [darwin]
    cmd: |
      if ! colima status >/dev/null 2>&1; then
        echo "🚀 Starting Colima..."
        colima start
      else
        echo "✅ Colima is already running"
      fi
    silent: true
    internal: true

  dev:services:
    desc: "Start development services in Docker"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: colima-status
      - cmd: docker compose up -d
    silent: true

  dev:services-down:
    desc: "Stop development services"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cmd: docker compose down

  dev:services-logs:
    desc: "Follow development services logs"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cmd: docker compose logs -f

  test:
    desc: "Run unit and integration tests"
    dir: "{{ .PROJECT_DIR }}"
    cmds:
      - cmd: ./gradlew test
    silent: true

  build-jar:
    desc: "Build the executable application JAR locally"
    cmds:
      - cmd: ./gradlew bootJar
    silent: false
    internal: true

  build:
    desc: "Build JAR locally and build production Docker image"
    deps:
      - build-jar
    cmds:
      - cmd: docker build -t dat250-project-app:latest .
