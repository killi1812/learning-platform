version: "3"

vars:
  BREW_DEPS: "openjdk@25 docker"

tasks:
  default:
    desc: "Default task (runs check)"
    cmds:
      - task: check

  setup:
    desc: "Verify and install required development dependencies via Homebrew"
    cmds:
      - cmd: |
          if task check >/dev/null 2>&1; then
            echo "✨ All dependencies are already installed and satisfied."
          else
            echo "🔧 Missing dependencies detected. Installing via Homebrew: {{.BREW_DEPS}}..."
            if ! command -v brew >/dev/null 2>&1; then
              echo "❌ Homebrew is required for automatic setup. Please install it from https://brew.sh"
              exit 1
            fi
            brew install {{.BREW_DEPS}}
            echo "🔄 Re-running checks..."
            task check
          fi
    silent: true

  check:
    desc: "Check git info and all required dependencies (brew, docker, java 25)"
    cmds:
      - task: git-info
      - task: check-brew
      - task: check-docker
      - task: check-java
    silent: true

  git-info:
    desc: "Prints your git info"
    cmds:
      - cmd: echo "----- Note this should be same as your gitlab -------"
      - cmd: echo "Name:" $(git config --get user.name)
      - cmd: echo "Email:" $(git config --get user.email)
    silent: true

  check-brew:
    desc: "Check if Homebrew is installed"
    cmds:
      - cmd: |
          if command -v brew >/dev/null 2>&1; then
            echo "✅ Homebrew is installed: $(brew --version | head -n 1)"
          else
            echo "❌ Homebrew is not installed"
            exit 1
          fi
    silent: true

  check-docker:
    desc: "Check if Docker is installed"
    cmds:
      - cmd: |
          if command -v docker >/dev/null 2>&1; then
            echo "✅ Docker is installed: $(docker --version)"
          else
            echo "❌ Docker is not installed"
            exit 1
          fi
    silent: true

  check-java:
    desc: "Check if Java version 25 is installed"
    cmds:
      - cmd: echo "--------- !Important -----------"
      - cmd: echo "Don't forget to add java to PATH"
      - cmd: echo "--------------------------------"
      - cmd: |
          if ! java -version >/dev/null 2>&1; then
            echo "❌ Java is not installed or not in PATH. Java 25 is required."
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if echo "$JAVA_VER" | grep -q '^25'; then
            echo "✅ Java 25 is installed (version: $JAVA_VER)"
          else
            echo "❌ Java version 25 is required, but found version: $JAVA_VER"
            exit 1
          fi
    silent: true

  dev:
    desc: "Run Spring Boot application locally"
    cmds:
      - cmd: |
          if [ -f "./gradlew" ]; then
            ./gradlew bootRun
          elif [ -f "./mvnw" ]; then
            ./mvnw spring-boot:run
          else
            echo "No gradlew or mvnw found. Please initialize your Spring Boot project first."
          fi

  dev:services:
    desc: "Start development services (PostgreSQL) in Docker"
    cmds:
      - cmd: docker compose up -d

  dev:services-down:
    desc: "Stop development services"
    cmds:
      - cmd: docker compose down

  dev:services-logs:
    desc: "Follow development services logs"
    cmds:
      - cmd: docker compose logs -f

  test:
    desc: "Run unit and integration tests"
    cmds:
      - cmd: |
          if [ -f "./gradlew" ]; then
            ./gradlew test
          elif [ -f "./mvnw" ]; then
            ./mvnw test
          else
            echo "No gradlew or mvnw found."
          fi

  build-jar:
    desc: "Build the executable application JAR locally"
    cmds:
      - cmd: |
          if [ -f "./gradlew" ]; then
            ./gradlew bootJar
          elif [ -f "./mvnw" ]; then
            ./mvnw clean package -DskipTests
          else
            echo "No gradlew or mvnw found. Please initialize your Spring Boot project first."
            exit 1
          fi
    silent: false
    internal: true

  build:
    desc: "Build JAR locally and build production Docker image"
    deps:
      - build-jar
    cmds:
      - cmd: docker compose -f docker-compose-prod.yml build
