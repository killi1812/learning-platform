version: "3"

dotenv: ['.env']

env:
  PATH: "{{.HOME}}/go/bin:{{.PATH}}"

vars:
  BREW_DEPS: "go docker colima npm node docker-compose"
  SERVER_DIR: "server"
  CLIENT_DIR: "client"
  BINARY_DIR: "./build"
  PACKAGE: "git.app.uib.no/hvl-dat-250/26h/semester-project/group-8/learning-platform"
  TEST_EXCLUDE: '{{.TEST_EXCLUDE | default "/docs"}}'
  TEST_PCKGS:
    sh: "go -C {{.SERVER_DIR}} list ./... | grep -Ev '{{.TEST_EXCLUDE}}' | tr '\n' ' '"
  BUILD: '{{.BUILD | default "prod"}}'
  VERSION:
    sh: "git describe --tags --always --abbrev=0 --match='v[0-9]*.[0-9]*.[0-9]*' 2> /dev/null | sed 's/^.//' || echo '0.0.0'"
  COMMIT_HASH:
    sh: "git rev-parse --short HEAD 2>/dev/null || echo 'n/a'"
  BUILD_TIMESTAMP:
    sh: "date '+%Y-%m-%dT%H:%M:%S'"
  LDFLAGS_COMMON: "-X '{{.PACKAGE}}/app.Version={{.VERSION}}' -X '{{.PACKAGE}}/app.CommitHash={{.COMMIT_HASH}}' -X '{{.PACKAGE}}/app.BuildTimestamp={{.BUILD_TIMESTAMP}}'"
  LDFLAGS: "-X '{{.PACKAGE}}/app.Build={{.BUILD}}' {{.LDFLAGS_COMMON}}"

tasks:
  default:
    desc: "Default task (runs check)"
    cmds:
      - task: check

  setup:
    desc: "Verify and install required development dependencies (Homebrew, Go tools: air, swag)"
    cmds:
      - cmd: |
          if [ ! -f .env ]; then
            if [ -f example.env ]; then
              echo "📄 Copying example.env to .env..."
              cp example.env .env
              echo "✅ Created .env from example.env"
            else
              echo "⚠️  example.env not found, could not create .env"
            fi
          else
            echo "✅ .env already exists"
          fi
      - cmd: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "❌ Homebrew is required for automatic setup on macOS/Linux. Please install it from https://brew.sh"
            exit 1
          fi
          echo "🔧 Installing system dependencies via Homebrew: {{.BREW_DEPS}}..."
          brew install {{.BREW_DEPS}}
      - task: install-tools
      - task: check-go-path
      - cmd: echo "🔄 Re-running checks..."
      - task: check
    silent: true

  check:
    desc: "Check git info and all required dependencies"
    cmds:
      - task: git-info
      - task: check-brew
      - task: check-docker
      - task: check-colima
      - task: check-go
      - task: check-go-path
      - task: check-tools
      - task: check-node
    silent: true

  git-info:
    desc: "Prints your git info"
    cmds:
      - cmd: echo "----- Note this should be same as your gitlab -------"
      - cmd: echo "Name:" $(git config --get user.name)
      - cmd: echo "Email:" $(git config --get user.email)
    silent: true
    internal: true

  check-brew:
    desc: "Check if Homebrew is installed"
    platforms: [darwin]
    cmds:
      - cmd: |
          if command -v brew >/dev/null 2>&1; then
            echo "✅ Homebrew is installed: $(brew --version | head -n 1)"
          else
            echo "❌ Homebrew is not installed"
            exit 1
          fi
    silent: true
    internal: true

  check-docker:
    desc: "Check if Docker is installed (Linux)"
    platforms: [linux]
    cmds:
      - cmd: |
          if command -v docker >/dev/null 2>&1; then
            echo "✅ Docker is installed: $(docker --version)"
          else
            echo "❌ Docker is not installed"
            exit 1
          fi
    silent: true
    internal: true

  check-colima:
    desc: "Check if Colima is installed (macOS)"
    platforms: [darwin]
    cmds:
      - cmd: |
          if command -v colima >/dev/null 2>&1; then
            echo "✅ Colima is installed: $(colima version | head -n 1)"
          else
            echo "❌ Colima is not installed"
            exit 1
          fi
    silent: true
    internal: true

  check-go:
    desc: "Check if Go is installed"
    cmds:
      - cmd: |
          if ! command -v go >/dev/null 2>&1; then
            echo "❌ Go is not installed or not in PATH. Go 1.25+ is required."
            exit 1
          fi
          echo "✅ Go is installed ($(go version))"
    silent: true
    internal: true

  check-go-path:
    desc: "Check if Go bin directory is in PATH"
    cmds:
      - cmd: |
          GOBIN="$(go env GOPATH)/bin"
          if ! echo "$PATH" | grep -q "$GOBIN" && ! echo "$PATH" | grep -q "$HOME/go/bin"; then
            echo "⚠️  Go bin directory ($GOBIN) is not in your shell's PATH."
            echo "   Add the following to your shell profile (~/.bashrc, ~/.zshrc, etc.):"
            echo "   export PATH=\"\$PATH:$GOBIN\""
          else
            echo "✅ Go bin directory is configured in PATH ($GOBIN)"
          fi
    silent: true
    internal: true

  check-tools:
    desc: "Check if air and swag are installed and in PATH"
    cmds:
      - cmd: |
          if ! command -v air >/dev/null 2>&1; then
            echo "❌ air is not installed or not in PATH. Run 'task setup' or 'go install github.com/air-verse/air@latest'."
            exit 1
          fi
          echo "✅ air is installed ($(air -v | head -n 1))"
          if ! command -v swag >/dev/null 2>&1; then
            echo "❌ swag is not installed or not in PATH. Run 'task setup' or 'go install github.com/swaggo/swag/cmd/swag@latest'."
            exit 1
          fi
          echo "✅ swag is installed ($(swag --version))"
    silent: true
    internal: true

  check-node:
    desc: "Check if Node.js and npm are installed"
    cmds:
      - cmd: |
          if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
            echo "❌ Node.js and npm are required for client development. Please install them."
            exit 1
          fi
          echo "✅ Node.js and npm are installed ($(node --version), npm $(npm --version))"
    silent: true
    internal: true

  dev:
    desc: "Run fullstack development environment (services, backend, and client)"
    cmds:
      - task: dev:services
      - defer: { task: dev:services-down }
      - cmd: task generate-swagger
        ignore_error: true
      - task: dev:apps
    silent: true

  dev:apps:
    desc: "Run backend and client applications concurrently"
    deps: [dev:backend, dev:client]
    silent: true
    internal: true

  dev:backend:
    desc: "Run Go backend locally with hot reload"
    aliases: [server-dev]
    dir: "{{ .SERVER_DIR }}"
    vars:
      BUILD: "dev"
      LDFLAGS: "-X '{{.PACKAGE}}/app.Build={{.BUILD}}' {{.LDFLAGS_COMMON}}"
    cmds:
      - cmd: task tidy
      - cmd: "echo 'Build info\n\tBuild:\t\t{{.BUILD}}\n\tVersion:\t{{.VERSION}}\n\tCommit:\t\t{{.COMMIT_HASH}}\n\tTime Stamp:\t{{.BUILD_TIMESTAMP}}'"
      - cmd: air -build.cmd='go build -ldflags="{{.LDFLAGS}}" -o ./tmp/main .'
    signal: SIGINT
    silent: true
    internal: true

  dev:client:
    desc: "Run Vue+Vuetify client locally"
    dir: "{{ .CLIENT_DIR }}"
    cmds:
      - cmd: |
          if [ ! -d "node_modules" ]; then
            echo "📦 Installing client dependencies..."
            npm install
          fi
          npm run dev || test $? -eq 130
    silent: true
    internal: true

  colima-status:
    desc: "Check if colima is running"
    platforms: [darwin]
    cmd: |
      if ! colima status >/dev/null 2>&1; then
        echo "🚀 Starting Colima..."
        colima start
      else
        echo "✅ Colima is already running"
      fi
    silent: true
    internal: true

  dev:services:
    desc: "Start development services in Docker"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - task: colima-status
      - cmd: docker compose up -d
    silent: true

  dev:services-down:
    desc: "Stop development services"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cmd: docker compose down

  dev:services-logs:
    desc: "Follow development services logs"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cmd: docker compose logs -f

  test:
    desc: "Run unit and integration tests"
    cmds:
      - task: test:backend

  test:backend:
    desc: "Run Go backend tests"
    dir: "{{ .SERVER_DIR }}"
    cmd: go test -v {{.TEST_PCKGS}} -parallel 10
    silent: false
    internal: true

  coverage:
    desc: "Produce project test coverage"
    cmds:
      - task: coverage:backend

  coverage:backend:
    desc: "Produce backend test coverage"
    aliases: [coverage-server]
    dir: "{{ .SERVER_DIR }}"
    cmds:
      - cmd: go test {{.TEST_PCKGS}} -coverprofile=coverage.out
      - cmd: go tool cover -html=coverage.out
    silent: true
    internal: true

  tidy:
    desc: "Runs go mod tidy"
    dir: "{{ .SERVER_DIR }}"
    cmds:
      - cmd: go mod tidy
    silent: false

  generate-swagger:
    desc: "Generate swagger documentation"
    dir: "{{ .SERVER_DIR }}"
    cmds:
      - cmd: swag fmt
      - cmd: swag init
    silent: true

  lint:
    desc: "Check code correctness and formatting for client and backend"
    deps:
      - lint:backend
      - lint:client

  lint:backend:
    desc: "Vet Go backend code"
    aliases: [lint-backend]
    dir: "{{ .SERVER_DIR }}"
    cmds:
      - cmd: go vet ./...
    silent: false
    internal: true

  lint:client:
    desc: "Lint and verify client TypeScript and Prettier formatting"
    aliases: [lint-frontend]
    dir: "{{ .CLIENT_DIR }}"
    cmds:
      - cmd: |
          if [ ! -d "node_modules" ]; then
            npm install
          fi
          npm run lint
    silent: true
    internal: true

  format:
    desc: "Format client code, Go backend code, and Swagger documentation"
    deps:
      - format:backend
      - format:client

  format:backend:
    desc: "Format Go code and generate Swagger documentation"
    aliases: [format-backend]
    dir: "{{ .SERVER_DIR }}"
    cmds:
      - cmd: swag fmt
      - cmd: swag init
      - cmd: go fmt ./...
    silent: true
    internal: true

  format:client:
    desc: "Format client code using Prettier"
    aliases: [format-frontend]
    dir: "{{ .CLIENT_DIR }}"
    cmds:
      - cmd: |
          if [ ! -d "node_modules" ]; then
            npm install
          fi
          npm run format
    silent: true
    internal: true

  build:docker:
    desc: "Build production Docker image with embedded frontend"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - cmd: >-
          docker build
          --build-arg BUILD="{{.BUILD}}"
          --build-arg VERSION="{{.VERSION}}"
          --build-arg COMMIT_HASH="{{.COMMIT_HASH}}"
          --build-arg BUILD_TIMESTAMP="{{.BUILD_TIMESTAMP}}"
          -t dat250-project-app:latest -f Dockerfile .
    internal: true

  build:
    desc: "Build production Docker image"
    cmds:
      - task: build:docker

  install-tools:
    desc: "Install development tools (air, swag)"
    cmds:
      - cmd: go install github.com/air-verse/air@latest
      - cmd: go install github.com/swaggo/swag/cmd/swag@latest
    silent: false

  list-tools:
    desc: "List tool versions"
    cmds:
      - go version
      - cmd: "echo --------------------------------------------"
      - task --version
      - cmd: "echo --------------------------------------------"
      - air -v
      - cmd: "echo --------------------------------------------"
      - swag --version
      - cmd: "echo --------------------------------------------"
      - docker --version
      - cmd: "echo --------------------------------------------"
      - docker compose --version
      - cmd: "echo --------------------------------------------"
      - cmd: "echo npm version: $(npm --version)"
    silent: true
