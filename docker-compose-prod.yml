services:
  db:
    image: postgres:17-alpine
    container_name: prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-learning_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db
          - postgres

  mongo:
    image: mongo:latest
    container_name: prod-mongo
    restart: always
    volumes:
      - prod_mongo_data:/data/db
    networks:
      default:
        aliases:
          - mongo

  app:
    image: ${APP_IMAGE:-dat250-project-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod-app
    restart: always
    expose:
      - "8080"
    environment:
      PORT: 8080
      DATABASE_CONN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-learning_platform}?sslmode=disable
      MONGO_CONN: mongodb://mongo:27017
      ACCESS_KEY: ${ACCESS_KEY}
      REFRESH_KEY: ${REFRESH_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started

  caddy:
    image: caddy:alpine
    container_name: prod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - prod_caddy_data:/data
      - prod_caddy_config:/config
    depends_on:
      - app

volumes:
  prod_postgres_data:
  prod_mongo_data:
  prod_caddy_data:
  prod_caddy_config:
