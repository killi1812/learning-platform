services:
  db:
    image: postgres:17-alpine
    container_name: prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db
          - postgres

  mongo:
    image: mongo:latest
    container_name: prod-mongo
    restart: always
    volumes:
      - prod_mongo_data:/data/db
    networks:
      default:
        aliases:
          - mongo

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: prod-seaweedfs
    restart: always
    command: "server -filer"
    volumes:
      - prod_seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - seaweedfs
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: prod-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - prod_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - rabbitmq

  app:
    image: ${APP_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_CONN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      MONGO_CONN: mongodb://mongo:27017
      SEAWEEDFS_ENDPOINT: http://seaweedfs:8888
      RABBITMQ_CONN: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      ACCESS_KEY: ${ACCESS_KEY}
      REFRESH_KEY: ${REFRESH_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  prod_postgres_data:
  prod_mongo_data:
  prod_seaweedfs_data:
  prod_rabbitmq_data:
