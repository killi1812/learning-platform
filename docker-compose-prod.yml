services:
  db:
    image: mongo:latest
    container_name: prod-mongo
    restart: always
    volumes:
      - prod_mongo_data:/data/db
    networks:
      default:
        aliases:
          - mongo
          - database

  app:
    image: ${APP_IMAGE:-dat250-project-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGO_CONN: mongodb://db:27017
      ACCESS_KEY: ${ACCESS_KEY}
      REFRESH_KEY: ${REFRESH_KEY}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    depends_on:
      - db

  caddy:
    image: caddy:alpine
    container_name: prod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - prod_caddy_data:/data
      - prod_caddy_config:/config
    depends_on:
      - app

volumes:
  prod_mongo_data:
  prod_caddy_data:
  prod_caddy_config:
