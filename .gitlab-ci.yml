workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "master"

stages:
  - test
  - build
  - package

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"

# ---------------------------------------------------------
# Cache definitions
# ---------------------------------------------------------
.go-cache: &go-cache
  key:
    files:
      - server/go.mod
      - server/go.sum
  paths:
    - .go/pkg/mod/

.npm-cache: &npm-cache
  key:
    files:
      - client/package.json
  paths:
    - client/.npm/

# ---------------------------------------------------------
# Test Stage
# ---------------------------------------------------------
backend:test:
  stage: test
  image: golang:1.25-alpine
  services:
    - name: mongo:latest
      alias: mongo
  variables:
    MONGO_CONN: "mongodb://mongo:27017"
    TEST_EXCLUDE: "/docs"
  cache:
    <<: *go-cache
  before_script:
    - cd server
  script:
    - go vet ./...
    - go test -v $(go list ./... | grep -Ev "${TEST_EXCLUDE}")

client:lint:
  stage: test
  image: node:22-alpine
  cache:
    <<: *npm-cache
  before_script:
    - cd client
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint

# ---------------------------------------------------------
# Build Stage
# ---------------------------------------------------------
backend:build:
  stage: build
  image: golang:1.25-alpine
  cache:
    <<: *go-cache
  before_script:
    - cd server
    - mkdir -p build
  script:
    - CGO_ENABLED=0 go build -ldflags="-X 'github.com/killi1812/wfrp5e-character_sheet/app.Build=prod' -X 'github.com/killi1812/wfrp5e-character_sheet/app.Version=$CI_COMMIT_SHORT_SHA' -X 'github.com/killi1812/wfrp5e-character_sheet/app.CommitHash=$CI_COMMIT_SHORT_SHA' -X 'github.com/killi1812/wfrp5e-character_sheet/app.BuildTimestamp=$(date '+%Y-%m-%dT%H:%M:%S')'" -o build/wfrp5ecs .
  artifacts:
    name: "backend-bin-$CI_COMMIT_SHORT_SHA"
    paths:
      - server/build/wfrp5ecs
    expire_in: 1 week

client:build:
  stage: build
  image: node:22-alpine
  cache:
    <<: *npm-cache
  before_script:
    - cd client
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    name: "client-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - client/dist/
    expire_in: 1 week

# ---------------------------------------------------------
# Package Stage (Docker images)
# ---------------------------------------------------------
docker:build:
  stage: package
  image: docker:latest
  needs:
    - backend:build
  script:
    - docker build -t dat250-project-app:$CI_COMMIT_SHORT_SHA ./server
    - docker build -t dat250-project-client:$CI_COMMIT_SHORT_SHA ./client
