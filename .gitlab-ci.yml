workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_BRANCH == "master"

stages:
  - test
  - build
  - package

variables:
  GOPATH: "$CI_PROJECT_DIR/.go"

# ---------------------------------------------------------
# Cache definitions
# ---------------------------------------------------------
.go-cache: &go-cache
  key:
    files:
      - server/go.mod
      - server/go.sum
  paths:
    - .go/pkg/mod/

.npm-cache: &npm-cache
  key:
    files:
      - client/package.json
  paths:
    - client/.npm/

# ---------------------------------------------------------
# Test Stage
# ---------------------------------------------------------
backend:test:
  stage: test
  image: golang:1.25-alpine
  services:
    - name: mongo:latest
      alias: mongo
  variables:
    MONGO_CONN: "mongodb://mongo:27017"
    TEST_EXCLUDE: "/docs"
  cache:
    <<: *go-cache
  before_script:
    - cd server
  script:
    - go vet ./...
    - go test -v $(go list ./... | grep -Ev "${TEST_EXCLUDE}")

client:lint:
  stage: test
  image: node:22-alpine
  cache:
    <<: *npm-cache
  before_script:
    - cd client
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint

# ---------------------------------------------------------
# Build Stage
# ---------------------------------------------------------
client:build:
  stage: build
  image: node:22-alpine
  cache:
    <<: *npm-cache
  before_script:
    - cd client
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    name: "client-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - client/dist/
    expire_in: 1 week

backend:build:
  stage: build
  image: golang:1.25-alpine
  cache:
    <<: *go-cache
  needs:
    - client:build
  before_script:
    - cd server
    - mkdir -p build web/dist
    - cp -r ../client/dist/* web/dist/
  script:
    - CGO_ENABLED=0 go build -ldflags="-X 'git.app.uib.no/hvl-dat-250/26h/semester-project/group-8/learning-platform/app.Build=prod' -X 'git.app.uib.no/hvl-dat-250/26h/semester-project/group-8/learning-platform/app.Version=$CI_COMMIT_SHORT_SHA' -X 'git.app.uib.no/hvl-dat-250/26h/semester-project/group-8/learning-platform/app.CommitHash=$CI_COMMIT_SHORT_SHA' -X 'git.app.uib.no/hvl-dat-250/26h/semester-project/group-8/learning-platform/app.BuildTimestamp=$(date '+%Y-%m-%dT%H:%M:%S')'" -o build/learning-platform .
  artifacts:
    name: "backend-bin-$CI_COMMIT_SHORT_SHA"
    paths:
      - server/build/learning-platform
    expire_in: 1 week

# ---------------------------------------------------------
# Package Stage (Docker images)
# ---------------------------------------------------------
docker:build:
  stage: package
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  needs:
    - backend:build
  script:
    - >-
        docker build
        --build-arg BUILD=prod
        --build-arg VERSION=$CI_COMMIT_SHORT_SHA
        --build-arg COMMIT_HASH=$CI_COMMIT_SHORT_SHA
        --build-arg BUILD_TIMESTAMP=$(date '+%Y-%m-%dT%H:%M:%S')
        -t dat250-project-app:$CI_COMMIT_SHORT_SHA -f Dockerfile .
